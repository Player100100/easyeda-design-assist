[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyeda-design-assist"
version = "0.1.0"
description = "Evidence-based design assistance and constrained schematic/PCB drawing for EasyEDA"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
pdf-render = ["pypdf>=5,<7", "PyMuPDF>=1.24,<2"]

[project.scripts]
easyeda-assist = "easyeda_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
